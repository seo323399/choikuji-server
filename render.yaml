services:
  - type: web
    name: choikuji
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: choikuji-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
